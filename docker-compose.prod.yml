# Production additions on top of docker-compose.yml: Caddy in front with HTTPS, nothing else
# published, and nightly database backups. On the server, put this in .env so a plain
# `docker compose …` uses both files:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    # Only reachable through Caddy.
    ports: !reset []
    environment:
      COOKIE_SECURE: 'true'
      # Caddy reaches the app over the Docker network, a private address range.
      TRUST_PROXY: uniquelocal

  db:
    # Only reachable by the app and the backups, over the Docker network.
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-franks}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-franks}
      TZ: Europe/Copenhagen
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
