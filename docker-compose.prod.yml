# Production additions on top of docker-compose.yml: the app joins the shared `web` network,
# where the server's shared Caddy (its own Compose project) serves it over HTTPS as `pool-app`;
# nothing else is published, and the database is backed up nightly. On the server, put this in
# .env so a plain `docker compose …` uses both files:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
services:
  app:
    # Only reachable through the shared Caddy.
    ports: !reset []
    environment:
      COOKIE_SECURE: 'true'
      # Caddy reaches the app over the `web` network, a private address range.
      TRUST_PROXY: uniquelocal
    networks:
      # The default network keeps the app reachable for db and backup.
      default:
      web:
        # Every project on `web` calls its service `app`, so each gets its own name there.
        aliases:
          - pool-app

  db:
    # Only reachable by the app and the backups, over the Docker network.
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-franks}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-franks}
      TZ: Europe/Copenhagen
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

networks:
  # Created once on the server with `docker network create web`, and shared with the Caddy
  # project.
  web:
    external: true
